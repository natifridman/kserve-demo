---
# IMPORTANT: Replace the placeholder value with your actual HuggingFace token
# You can get a token from https://huggingface.co/settings/tokens
#
# To create the base64-encoded value:
#   echo -n "hf_your_token_here" | base64
#
# Or use a Kustomize secretGenerator (see kustomization.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
type: Opaque
data:
  HF_TOKEN: REPLACE_WITH_BASE64_ENCODED_HF_TOKEN
