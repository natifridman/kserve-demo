---
# LLMInferenceServiceConfig defines the template for LLM inference services
# This uses llm-d (https://llm-d.ai) for serving LLMs with vLLM
# API version: v1alpha2
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: llm-template
spec:
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-cuda:v0.4.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            vllm serve /mnt/models --served-model-name "{{ .Spec.Model.Name }}" --port 8000 --disable-log-requests $VLLM_ADDITIONAL_ARGS
        ports:
          - containerPort: 8000
        env:
          - name: HOME
            value: /home
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: HF_HUB_CACHE
            value: /models
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 4800
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
          - mountPath: /home
            name: home
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /models
            name: model-cache
          - mountPath: /etc/ssl/certs
            name: tls-certs
            readOnly: true
    terminationGracePeriodSeconds: 30
    volumes:
      - name: home
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: model-cache
        emptyDir: {}
      - name: tls-certs
        secret:
          secretName: '{{ ChildName .ObjectMeta.Name `-kserve-self-signed-certs` }}'
  router:
    scheduler:
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: '{{ ChildName .ObjectMeta.Name `-epp-service` }}'
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ .ObjectMeta.Name }}'
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
      template:
        containers:
          - name: main
            image: ghcr.io/llm-d/llm-d-inference-scheduler:v0.4.0
            imagePullPolicy: IfNotPresent
            args:
              - --pool-name
              - '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
              - --pool-namespace
              - '{{ .ObjectMeta.Namespace }}'
              - --zap-encoder
              - json
              - --grpc-port
              - "9002"
              - --grpc-health-port
              - "9003"
              - --secure-serving
              - --cert-path
              - /etc/ssl/certs
              - --config-file
              - /etc/config/endpoint-picker-config.yaml
            ports:
              - containerPort: 9002
                name: grpc
              - containerPort: 9003
                name: grpc-health
              - containerPort: 9090
                name: metrics
            resources:
              requests:
                cpu: 256m
                memory: 500Mi
            livenessProbe:
              grpc:
                port: 9003
                service: envoy.service.ext_proc.v3.ExternalProcessor
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3
            readinessProbe:
              grpc:
                port: 9003
                service: envoy.service.ext_proc.v3.ExternalProcessor
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - mountPath: /etc/ssl/certs
                name: tls-certs
                readOnly: true
              - mountPath: /etc/config
                name: endpoint-picker-config
                readOnly: true
        terminationGracePeriodSeconds: 30
        volumes:
          - name: tls-certs
            secret:
              secretName: '{{ ChildName .ObjectMeta.Name `-kserve-self-signed-certs` }}'
          - name: endpoint-picker-config
            configMap:
              name: endpoint-picker-config
