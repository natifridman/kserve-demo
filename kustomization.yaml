apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set your target namespace here
namespace: nati-kserve-demo

resources:
  - namespace.yaml
  - gateway/

  # Choose ONE of the following API versions:
  # Option 1: v1alpha1 (current/stable)
  - llm-config/
  - models/example-model/
  # Option 2: v1alpha2 (newer API) - uncomment below and comment above
  # - llm-config-v1alpha2/
  # - models/gpt-oss-20b/

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/part-of: kserve-demo
    includeSelectors: false

# Patches for environment-specific configuration
patches:
  # Patch the namespace name (must match the namespace field above)
  - target:
      kind: Namespace
      name: placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: nati-kserve-demo

  # Patch the HuggingFace secret with your token
  # Option 1: Replace the placeholder directly
  - target:
      kind: Secret
      name: hf-token
    patch: |-
      - op: replace
        path: /data/HF_TOKEN
        # Replace with your base64-encoded HuggingFace token
        # Generate with: echo -n "hf_your_token_here" | base64
        value: REPLACE_WITH_BASE64_ENCODED_HF_TOKEN

  # Patch storage class if needed (uncomment and adjust)
  # - target:
  #     kind: PersistentVolumeClaim
  #     name: example-model-pvc
  #   patch: |-
  #     - op: replace
  #       path: /spec/storageClassName
  #       value: your-storage-class

# Alternative: Generate the secret from a literal value
# Comment out the hf-secret.yaml in llm-config/kustomization.yaml if using this
#
# secretGenerator:
#   - name: hf-token
#     literals:
#       - HF_TOKEN=hf_your_token_here
#     options:
#       disableNameSuffixHash: true

# Image customization (uncomment to override versions)
# images:
#   # v1alpha1 uses v0.2.x images
#   - name: ghcr.io/llm-d/llm-d-dev
#     newTag: v0.2.3
#   - name: ghcr.io/llm-d/llm-d-inference-scheduler
#     newTag: v0.2.2
#   # v1alpha2 uses v0.4.0 images
#   - name: ghcr.io/llm-d/llm-d-cuda
#     newTag: v0.4.0
#   - name: ghcr.io/llm-d/llm-d-inference-scheduler
#     newTag: v0.4.0
